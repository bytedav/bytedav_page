# Pages CMS Configuration (https://pagescms.org)
# Configuración optimizada: los campos técnicos (slugs, IDs, tiempo de lectura, URLs derivadas)
# son calculados dinámicamente por la aplicación y no requieren entrada manual.

settings:
  title: Bytedav CMS

media:
  input: public
  output: /
  categories:
    - image

content:
  # 1. Configuración General del Holding
  - name: holding
    label: Configuración del Holding
    type: file
    path: src/data/holding.json
    format: json
    fields:
      - name: name
        label: Nombre Comercial
        type: string
        required: true
      - name: legalName
        label: Razón Social / Nombre Legal
        type: string
        required: true
      - name: tagline
        label: Lema / Tagline
        type: string
        required: true
      - name: domain
        label: Dominio Web Canónico
        type: string
        required: true
      - name: contactEmail
        label: Correo de Contacto Corporativo
        type: string
        required: true
      - name: socialLinks
        label: Redes Sociales Oficiales
        type: object
        fields:
          - name: linkedin
            label: LinkedIn Corporativo
            type: string
          - name: facebook
            label: Facebook
            type: string
          - name: tiktok
            label: TikTok
            type: string
          - name: instagram
            label: Instagram
            type: string
          - name: youtube
            label: YouTube
            type: string

  # 2. Marcas del Portafolio
  - name: brands
    label: Marcas del Portafolio
    type: file
    path: src/data/brands.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre de la Marca
        type: string
        required: true
      - name: yearFounded
        label: Año de Lanzamiento / Incubación
        type: number
        required: true
      - name: description
        label: Descripción de la Plataforma
        type: text
        required: true
      - name: websiteUrl
        label: Enlace al Sitio Web Oficial
        type: string
        required: true
      - name: image
        label: Imagen / Logotipo
        type: image
        required: true

  # 3. Hitos y Trayectoria
  - name: milestones
    label: Hitos y Trayectoria
    type: file
    path: src/data/milestones.json
    format: json
    list: true
    fields:
      - name: year
        label: Año
        type: string
        required: true
      - name: quarter
        label: Periodo / Hito (ej. Fundación, Incubación)
        type: string
        required: true
      - name: title
        label: Título del Hito
        type: string
        required: true
      - name: description
        label: Descripción Detallada
        type: text
        required: true
      - name: metricsBadge
        label: Insignia / Badge (Opcional)
        type: string
      - name: highlight
        label: Destacar con Corona (Hito Clave)
        type: boolean

  # 4. Equipo Directivo
  - name: leaders
    label: Equipo Directivo
    type: file
    path: src/data/leaders.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre Completo
        type: string
        required: true
      - name: area
        label: Cargo / Posición
        type: string
        required: true
      - name: bio
        label: Biografía y Trayectoria
        type: text
        required: true
      - name: image
        label: Fotografía Oficial
        type: image
        required: true
      - name: email
        label: Correo Electrónico
        type: string
      - name: linkedin
        label: Enlace de LinkedIn
        type: string
      - name: specialties
        label: Especialidades / Áreas de Dominio
        type: string
        list: true

  # 5. Pilares Estratégicos
  - name: pillars
    label: Pilares Estratégicos
    type: file
    path: src/data/pillars.json
    format: json
    list: true
    fields:
      - name: title
        label: Título del Pilar
        type: string
        required: true

  # 6. Blog Minimalista (solo título, descripción, fecha y contenido opcional; slugs y readTime son dinámicos)
  - name: blog
    label: Artículos del Blog
    type: file
    path: src/data/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Título del Artículo
        type: string
        required: true
      - name: description
        label: Descripción / Entradilla
        type: text
        required: true
      - name: date
        label: Fecha de Publicación (Opcional, por defecto hoy)
        type: date
      - name: author
        label: Autor (Opcional, por defecto bytedav.)
        type: string
      - name: content
        label: Contenido del Artículo (Opcional)
        type: text
