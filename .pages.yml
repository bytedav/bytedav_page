# Pages CMS Configuration (https://pagescms.org)
# Los campos técnicos (slugs, IDs, tiempo de lectura, URLs derivadas)
# los calcula la aplicación y no requieren entrada manual.

settings:
  title: Bytedav CMS

media:
  input: public
  output: /
  rename: safe
  categories:
    - image

content:
  # 1. Configuración General del Holding
  - name: holding
    label: Configuración del Holding
    type: file
    path: src/data/holding.json
    format: json
    fields:
      - name: name
        label: Nombre Comercial
        type: string
        required: true
        description: Nombre público con el que se conoce al holding.
      - name: legalName
        label: Razón Social / Nombre Legal
        type: string
        required: true
        description: Nombre legal registrado de la empresa.
      - name: tagline
        label: Lema / Tagline
        type: string
        required: true
        description: Frase corta que resume la propuesta del holding.
      - name: domain
        label: Dominio Web Canónico
        type: string
        required: true
        description: Dominio principal con protocolo. Ejemplo, https://bytedav.com
        pattern:
          regex: '^https?://[^\s/$.?#].[^\s]*$'
          message: Ingresa una URL válida que empiece con http:// o https://
      - name: contactEmail
        label: Correo de Contacto Corporativo
        type: string
        required: true
        description: Correo público de contacto.
        pattern:
          regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
          message: Ingresa un correo electrónico válido.
      - name: socialLinks
        label: Redes Sociales Oficiales
        type: object
        description: Enlaces completos a los perfiles oficiales. Deja vacío lo que no aplique.
        fields:
          - name: linkedin
            label: LinkedIn Corporativo
            type: string
            pattern:
              regex: '^$|^https?://.+'
              message: Debe ser una URL completa (https://...).
          - name: facebook
            label: Facebook
            type: string
            pattern:
              regex: '^$|^https?://.+'
              message: Debe ser una URL completa (https://...).
          - name: tiktok
            label: TikTok
            type: string
            pattern:
              regex: '^$|^https?://.+'
              message: Debe ser una URL completa (https://...).
          - name: instagram
            label: Instagram
            type: string
            pattern:
              regex: '^$|^https?://.+'
              message: Debe ser una URL completa (https://...).
          - name: youtube
            label: YouTube
            type: string
            pattern:
              regex: '^$|^https?://.+'
              message: Debe ser una URL completa (https://...).

  # 2. Marcas del Portafolio
  - name: brands
    label: Marcas del Portafolio
    type: file
    path: src/data/brands.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre de la Marca
        type: string
        required: true
      - name: yearFounded
        label: Año de Lanzamiento / Incubación
        type: number
        required: true
        description: Año en formato de cuatro dígitos.
        options:
          min: 1900
          max: 2100
      - name: description
        label: Descripción de la Plataforma
        type: text
        required: true
        description: Resumen breve de qué hace la marca.
      - name: websiteUrl
        label: Enlace al Sitio Web Oficial
        type: string
        required: true
        pattern:
          regex: '^https?://.+'
          message: Debe ser una URL completa (https://...).
      - name: image
        label: Imagen / Logotipo
        type: image
        required: true
        description: Logotipo de la marca, preferiblemente con fondo transparente.

  # 3. Hitos y Trayectoria
  - name: milestones
    label: Hitos y Trayectoria
    type: file
    path: src/data/milestones.json
    format: json
    list: true
    fields:
      - name: year
        label: Año
        type: string
        required: true
        pattern:
          regex: '^\d{4}$'
          message: Usa cuatro dígitos, por ejemplo 2024.
      - name: quarter
        label: Periodo / Hito (ej. Fundación, Incubación)
        type: string
        required: true
      - name: title
        label: Título del Hito
        type: string
        required: true
      - name: description
        label: Descripción Detallada
        type: text
        required: true
      - name: metricsBadge
        label: Insignia / Badge (Opcional)
        type: string
        description: Texto corto de métrica o logro. Ejemplo, +10K usuarios
      - name: highlight
        label: Destacar con Corona (Hito Clave)
        type: boolean
        default: false

  # 4. Equipo Directivo
  - name: leaders
    label: Equipo Directivo
    type: file
    path: src/data/leaders.json
    format: json
    list: true
    fields:
      - name: name
        label: Nombre Completo
        type: string
        required: true
      - name: area
        label: Cargo / Posición
        type: string
        required: true
      - name: bio
        label: Biografía y Trayectoria
        type: text
        required: true
      - name: image
        label: Fotografía Oficial
        type: image
        required: true
        description: Retrato cuadrado o vertical con buena iluminación.
      - name: email
        label: Correo Electrónico
        type: string
        pattern:
          regex: '^$|^[^\s@]+@[^\s@]+\.[^\s@]+$'
          message: Ingresa un correo electrónico válido.
      - name: linkedin
        label: Enlace de LinkedIn
        type: string
        pattern:
          regex: '^$|^https?://.+'
          message: Debe ser una URL completa (https://...).
      - name: specialties
        label: Especialidades / Áreas de Dominio
        type: string
        list: true
        description: Agrega una especialidad por elemento.

  # 5. Pilares Estratégicos
  - name: pillars
    label: Pilares Estratégicos
    type: file
    path: src/data/pillars.json
    format: json
    list: true
    fields:
      - name: title
        label: Título del Pilar
        type: string
        required: true

  # 6. Blog (slugs y readTime son dinámicos)
  - name: blog
    label: Artículos del Blog
    type: file
    path: src/data/posts.json
    format: json
    list: true
    fields:
      - name: title
        label: Título del Artículo
        type: string
        required: true
      - name: description
        label: Descripción / Entradilla
        type: text
        required: true
        description: Resumen que aparece en listados y metadatos.
      - name: date
        label: Fecha de Publicación (Opcional, por defecto hoy)
        type: date
      - name: author
        label: Autor (Opcional, por defecto bytedav.)
        type: string
        default: bytedav
      - name: content
        label: Contenido del Artículo (Opcional)
        type: text